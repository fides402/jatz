name: Weekly rap section

on:
  schedule:
    # Saturdays, 12:00 UTC. "New Music Friday" releases go live at midnight
    # LOCAL per market, not a synced UTC instant, and the two editorial
    # sources this reads (RapManiacZ IT, POW Mag US) write up that day's
    # drops over the course of Friday -- sometimes into Friday evening or
    # later. Friday 06:00 UTC (02:00 US Eastern, 08:00 Italy) ran before
    # either had published anything about that day's own releases, so every
    # week was structurally a cycle late. Saturday noon UTC is Friday
    # afternoon/evening across the US and Saturday midday in Italy --
    # comfortably after both sites have covered that week's Friday.
    - cron: "0 12 * * 6"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even if this week's file already exists"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.JATZ_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run weekly rap curator
        working-directory: engine
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python run_weekly_rap.py $ARGS

      - name: Commit drop + state
        run: |
          git config user.name "jatz-bot"
          git config user.email "francescocapuani92@gmail.com"
          git add drops_rap/ engine/state/seen_rap_releases.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Weekly rap section $(date -u +%G-W%V)"
            git push
          fi
