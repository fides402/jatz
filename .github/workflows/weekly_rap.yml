name: Weekly rap section

on:
  schedule:
    # Fridays, 06:00 UTC -- "new music Friday" is the industry-wide release
    # day, so this runs a few hours after most of the week's drops exist.
    - cron: "0 6 * * 5"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even if this week's file already exists"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.JATZ_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run weekly rap curator
        working-directory: engine
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python run_weekly_rap.py $ARGS

      - name: Commit drop + state
        run: |
          git config user.name "jatz-bot"
          git config user.email "francescocapuani92@gmail.com"
          git add drops_rap/ engine/state/seen_rap_releases.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Weekly rap section $(date -u +%G-W%V)"
            git push
          fi
